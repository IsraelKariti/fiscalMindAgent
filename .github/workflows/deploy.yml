name: Deploy to Azure

# Manual-only: pushes to master auto-deploy the sandbox (deploy-sandbox.yml);
# promote to production by running this workflow from the Actions tab (or
# `gh workflow run deploy.yml`).
on:
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  RG: fiscalmind-resourcegroup
  ACR: fiscalmindacr
  IMAGE: fiscalmindacr.azurecr.io/fiscalmind-agent

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image (reused when the sandbox deploy already built this SHA)
        run: |
          az acr login --name $ACR
          if az acr repository show --name $ACR --image fiscalmind-agent:${{ github.sha }} > /dev/null 2>&1; then
            echo "tag already in ACR — skipping build"
          else
            docker build -t $IMAGE:${{ github.sha }} .
            docker push $IMAGE:${{ github.sha }}
          fi

      - name: Update worker
        run: |
          az containerapp update -n fiscalmind-worker -g $RG \
            --image $IMAGE:${{ github.sha }}

      - name: Run DB migrations (from worker, inside vnet)
        # `az containerapp exec` needs a TTY, which CI runners lack — `script`
        # fakes one. az doesn't propagate the remote exit code, so grep for the
        # migrator's success line instead.
        run: |
          script -q -e -c "az containerapp exec -n fiscalmind-worker -g $RG --command 'node dist/scripts/migrate.js'" /dev/null | tee migrate.log
          grep -q "migrations complete" migrate.log

      - name: Update web
        run: |
          az containerapp update -n fiscalmind-web -g $RG \
            --image $IMAGE:${{ github.sha }}

      - name: Health check
        run: |
          sleep 30
          curl -fsS https://agent.fiscalmind.app/healthz
