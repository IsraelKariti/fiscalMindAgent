name: Deploy to Azure

# Manual-only: pushes to master auto-deploy the sandbox (deploy-sandbox.yml);
# promote to production by running this workflow from the Actions tab (or
# `gh workflow run deploy.yml`).
#
# Production runs on App Service in Israel Central (fiscalmind-il-web/-worker,
# RG fiscalmind-israel) behind the fiscalmind-il-natgw static egress IP.
# Migrations run inside the worker's startup command (App Service has no
# `exec`), so a healthy worker implies they succeeded.
on:
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  RG: fiscalmind-israel
  ACR: fiscalmindacr
  IMAGE: fiscalmindacr.azurecr.io/fiscalmind-agent
  BROWSER_IMAGE: fiscalmindacr.azurecr.io/fiscalmind-browser

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image (reused when the sandbox deploy already built this SHA)
        run: |
          az acr login --name $ACR
          if az acr repository show --name $ACR --image fiscalmind-agent:${{ github.sha }} > /dev/null 2>&1; then
            echo "tag already in ACR — skipping build"
          else
            docker build --build-arg GIT_SHA=${{ github.sha }} -t $IMAGE:${{ github.sha }} .
            docker push $IMAGE:${{ github.sha }}
          fi

      # The tax-fetch ACI browser runner ships as its own image and must stay
      # in lockstep with the worker's HTTP contract (src/browserRunner/protocol.ts)
      # — a stale image broke every prod fetch on 2026-08-01. Building it here,
      # tagged with the same SHA, keeps them in sync by construction.
      - name: Build and push browser-runner image
        run: |
          if az acr repository show --name $ACR --image fiscalmind-browser:${{ github.sha }} > /dev/null 2>&1; then
            echo "tag already in ACR — skipping build"
          else
            docker build -f Dockerfile.browser-runner -t $BROWSER_IMAGE:${{ github.sha }} .
            docker push $BROWSER_IMAGE:${{ github.sha }}
          fi

      - name: Update worker (startup command runs migrations before the worker)
        run: |
          # appsettings set echoes every setting's value — keep secrets out of the CI log.
          az webapp config appsettings set -n fiscalmind-il-worker -g $RG \
            --settings TAX_FETCH_ACI_IMAGE=$BROWSER_IMAGE:${{ github.sha }} > /dev/null
          az webapp config container set -n fiscalmind-il-worker -g $RG \
            --container-image-name $IMAGE:${{ github.sha }} \
            --container-registry-url https://fiscalmindacr.azurecr.io
          az webapp restart -n fiscalmind-il-worker -g $RG

      # /healthz reports the build's git sha: waiting for THIS sha (not any
      # 200) is what proves the NEW container booted — during the swap the old
      # build keeps serving 200s, which used to pass this check spuriously.
      - name: Wait for worker health (this sha answering implies migrations succeeded)
        run: |
          for i in $(seq 1 60); do
            got=$(curl -fsS "https://fiscalmind-il-worker.azurewebsites.net/healthz" 2>/dev/null | jq -r '.sha // empty' 2>/dev/null || true)
            if [ "$got" = "${{ github.sha }}" ]; then
              echo "worker healthy on ${{ github.sha }}"; exit 0
            fi
            echo "waiting (serving: ${got:-none})"; sleep 10
          done
          echo "worker never came up on ${{ github.sha }}"; exit 1

      - name: Update web
        run: |
          az webapp config container set -n fiscalmind-il-web -g $RG \
            --container-image-name $IMAGE:${{ github.sha }} \
            --container-registry-url https://fiscalmindacr.azurecr.io
          az webapp restart -n fiscalmind-il-web -g $RG

      - name: Health check
        run: |
          for i in $(seq 1 60); do
            got=$(curl -fsS "https://fiscalmind-il-web.azurewebsites.net/healthz" 2>/dev/null | jq -r '.sha // empty' 2>/dev/null || true)
            if [ "$got" = "${{ github.sha }}" ]; then
              echo "web healthy on ${{ github.sha }}"; exit 0
            fi
            echo "waiting (serving: ${got:-none})"; sleep 10
          done
          echo "web never came up on ${{ github.sha }}"; exit 1
