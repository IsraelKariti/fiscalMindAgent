name: Deploy to Azure sandbox

# Every push to master lands here automatically; production (deploy.yml) is
# promoted manually afterwards. The dispatch trigger remains for rehearsing an
# arbitrary ref — a risky migration batch, a Twilio/webhook flow, a
# deploy-mechanics change.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to deploy
        default: master
        required: true

concurrency:
  group: deploy-sandbox
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

# The sandbox lives in its own subscription (FiscalMind Sandbox) on App Service
# in Israel Central; the ACR stays in the production subscription, so ACR
# commands run on the login default while webapp commands pass --subscription
# explicitly. Migrations + demo seed run inside the worker's startup command
# (App Service has no `exec`), so a healthy worker implies both succeeded.
env:
  RG: fiscalmind-sandbox
  ACR: fiscalmindacr
  IMAGE: fiscalmindacr.azurecr.io/fiscalmind-agent
  SANDBOX_SUB: ${{ secrets.AZURE_SANDBOX_SUBSCRIPTION_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # push events have no inputs — fall back to the pushed commit
          ref: ${{ inputs.ref || github.sha }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push image (reused when the prod deploy already built this SHA)
        run: |
          az acr login --name $ACR
          if az acr repository show --name $ACR --image fiscalmind-agent:${{ steps.sha.outputs.sha }} > /dev/null 2>&1; then
            echo "tag already in ACR — skipping build"
          else
            docker build -t $IMAGE:${{ steps.sha.outputs.sha }} .
            docker push $IMAGE:${{ steps.sha.outputs.sha }}
          fi

      - name: Update worker (startup command runs migrations + seed before the worker)
        run: |
          az webapp config container set -n sandbox-il-worker -g $RG --subscription $SANDBOX_SUB \
            --container-image-name $IMAGE:${{ steps.sha.outputs.sha }} \
            --container-registry-url https://fiscalmindacr.azurecr.io
          az webapp restart -n sandbox-il-worker -g $RG --subscription $SANDBOX_SUB

      - name: Wait for worker health (implies migrations + seed succeeded)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://sandbox-il-worker.azurewebsites.net/healthz" > /dev/null 2>&1; then
              echo "worker healthy"; exit 0
            fi
            sleep 10
          done
          echo "worker never became healthy"; exit 1

      - name: Update web
        run: |
          az webapp config container set -n sandbox-il-web -g $RG --subscription $SANDBOX_SUB \
            --container-image-name $IMAGE:${{ steps.sha.outputs.sha }} \
            --container-registry-url https://fiscalmindacr.azurecr.io
          az webapp restart -n sandbox-il-web -g $RG --subscription $SANDBOX_SUB

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://sandbox-il-web.azurewebsites.net/healthz" > /dev/null 2>&1; then
              echo "web healthy"; exit 0
            fi
            sleep 10
          done
          echo "web never became healthy"; exit 1
