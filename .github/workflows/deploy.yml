name: Deploy to Azure

# Manual-only: pushes to master auto-deploy the sandbox (deploy-sandbox.yml);
# promote to production by running this workflow from the Actions tab (or
# `gh workflow run deploy.yml`).
#
# Production runs on App Service in Israel Central (fiscalmind-il-web/-worker,
# RG fiscalmind-israel) behind the fiscalmind-il-natgw static egress IP.
# Migrations run inside the worker's startup command (App Service has no
# `exec`), so a healthy worker implies they succeeded.
on:
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  RG: fiscalmind-israel
  ACR: fiscalmindacr
  IMAGE: fiscalmindacr.azurecr.io/fiscalmind-agent

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image (reused when the sandbox deploy already built this SHA)
        run: |
          az acr login --name $ACR
          if az acr repository show --name $ACR --image fiscalmind-agent:${{ github.sha }} > /dev/null 2>&1; then
            echo "tag already in ACR — skipping build"
          else
            docker build -t $IMAGE:${{ github.sha }} .
            docker push $IMAGE:${{ github.sha }}
          fi

      - name: Update worker (startup command runs migrations before the worker)
        run: |
          az webapp config container set -n fiscalmind-il-worker -g $RG \
            --container-image-name $IMAGE:${{ github.sha }} \
            --container-registry-url https://fiscalmindacr.azurecr.io
          az webapp restart -n fiscalmind-il-worker -g $RG

      - name: Wait for worker health (implies migrations succeeded)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://fiscalmind-il-worker.azurewebsites.net/healthz" > /dev/null 2>&1; then
              echo "worker healthy"; exit 0
            fi
            sleep 10
          done
          echo "worker never became healthy"; exit 1

      - name: Update web
        run: |
          az webapp config container set -n fiscalmind-il-web -g $RG \
            --container-image-name $IMAGE:${{ github.sha }} \
            --container-registry-url https://fiscalmindacr.azurecr.io
          az webapp restart -n fiscalmind-il-web -g $RG

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://fiscalmind-il-web.azurewebsites.net/healthz" > /dev/null 2>&1; then
              echo "web healthy"; exit 0
            fi
            sleep 10
          done
          echo "web never became healthy"; exit 1
